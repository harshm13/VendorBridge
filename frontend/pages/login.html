<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VendorBridge ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/appearance.js"></script>
</head>
<body>

    <!-- Three Canvas -->
    <div id="threeCanvasContainer"></div>

    <div class="login-container">
        <div class="login-card tilt-card">
            <!-- Badge -->
            <div class="motion-badge" style="margin-bottom: 12px;">
                <div class="motion-badge-inner">
                    <span class="pulse-dot"></span>
                    <span class="motion-badge-text">Secure Identity Gateway</span>
                </div>
            </div>

            <div class="login-header">
                <h1>VendorBridge</h1>
                <p>Enterprise Procurement & Vendor Management ERP</p>
            </div>

            <div id="alertBox" class="alert-box"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Work Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-lock"></i> Account Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" style="padding-right: 40px;">
                        <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; box-shadow: none;">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-id-badge"></i> Access Role</label>
                    <select id="role" required>
                        <option value="">Choose Assigned Role</option>
                        <option value="admin">System Administrator</option>
                        <option value="manager">Approving Manager</option>
                        <option value="procurement_officer">Procurement Officer</option>
                        <option value="vendor">Vendor Partner</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary login-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Workspace
                </button>
            </form>

            <!-- 1-Click Demo Accounts -->
            <div class="quick-demo-section">
                <span class="quick-demo-title"><i class="fa-solid fa-wand-magic-sparkles" style="color: #6366f1;"></i> 1-Click Instant Demo Credentials:</span>
                <div class="demo-chip-grid">
                    <div class="demo-chip" onclick="fillDemo('admin@vendorbridge.com', 'admin123', 'admin')">
                        <i class="fa-solid fa-shield-halved" style="color: #10b981;"></i>
                        <span>Admin</span>
                    </div>
                    <div class="demo-chip" onclick="fillDemo('manager@vendorbridge.com', 'manager123', 'manager')">
                        <i class="fa-solid fa-user-check" style="color: #a855f7;"></i>
                        <span>Manager</span>
                    </div>
                    <div class="demo-chip" onclick="fillDemo('procurement@vendorbridge.com', 'procurement123', 'procurement_officer')">
                        <i class="fa-solid fa-briefcase" style="color: #38bdf8;"></i>
                        <span>Officer</span>
                    </div>
                    <div class="demo-chip" onclick="fillDemo('abc@suppliers.com', 'vendor123', 'vendor')">
                        <i class="fa-solid fa-truck" style="color: #f59e0b;"></i>
                        <span>Vendor</span>
                    </div>
                </div>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <button type="button" class="signup-btn" onclick="window.location.href='newaccount.html'">
                <i class="fa-solid fa-user-plus"></i> Create New Account
            </button>

            <div class="footer-links">
                <a href="index.html">← Back to Overview</a>
            </div>
        </div>
    </div>

    <!-- Client Scripts -->
    <script src="js/api.js"></script>
    <script src="js/three-scene.js"></script>
    <script src="js/tilt.js"></script>
    <script>
        function fillDemo(email, pass, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
            document.getElementById('role').value = role;
            showAlert(`Auto-filled ${role.replace('_', ' ').toUpperCase()} credentials. Click 'Sign In' to proceed.`, 'info');
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;

            try {
                showAlert('Authenticating with Enterprise Mesh...', 'info');
                const res = await API.login(email, password, role);
                Auth.setUser(res.user);
                Auth.setToken(res.token);
                showAlert('Authentication successful! Launching workspace...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            } catch (err) {
                showAlert(err.message || 'Login failed. Please verify your credentials and selected role.', 'danger');
            }
        });
    </script>
</body>
</html>
